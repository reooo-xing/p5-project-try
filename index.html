<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的 p5.js 测试</title>
    <!-- 这一行代码就是在线引入 p5.js 库，不需要下载 -->
    <script src="p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f0f0f0; }
        #wave-bg { position: fixed; inset: 0; z-index: 0; }
        #face { border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <canvas id="wave-bg"></canvas>
    <script>
        let emotions = {
            joy:      ["Joy", "Alegría", "Joie", "Freude", "喜び", "فرح", "खुशी"],
            sadness:  ["Sadness", "Tristeza", "Tristesse", "Traurigkeit", "悲しみ", "حزن", "उदासी"],
            anger:    ["Anger", "Ira", "Colère", "Wut", "怒り", "غضب", "गुस्सा"],
            fear:     ["Fear", "Miedo", "Peur", "Angst", "恐れ", "خوف", "डर"],
            disgust:  ["Disgust", "Asco", "Dégoût", "Ekel", "嫌悪", "اشمئزاز", "घृणा"],
            surprise: ["Surprise", "Sorpresa", "Überraschung", "驚き", "مفاجأة", "आश्चर्य"],
            contempt: ["Contempt", "Desdén", "Mépris", "Verachtung", "軽蔑", "ازدراء", "तिरस्कार"]
        };

        let selector, current = 'joy';
        let canvas;
        let placements = [];  // 每个元素：{ word, chars, x, y, angle, tw, hover, reveal }

        // 乱码时随机出现的字符集
        const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*?';

        // ---- 单词弹簧参数 ----
        let stiffness = 0.08;   // 弹性系数，越大回弹越快
        let damping = 0.85;     // 阻尼系数，越小摆动越久
        let grabbedWord = null; // 当前被鼠标抓住（拉动）的单词

        // ---- 作文网格参数 ----
        let gridSize = 22;                          // 格子大小（像素），越大格子越少
        let gridColor = '#e0e0e0';                  // 网格线颜色
        let gridBgColor = 'rgba(255,255,255,0.85)'; // 半透明白底（让背后的波透出来）
        let gridVerts = [];       // 网格交点（2D：gridVerts[行][列]），参与弹性形变
        let gridXs = [], gridYs = [];  // 每列/每行的原位坐标
        let gridAnchor = null;   // 网格跟随的“锚点”单词（松开后仍保留，随其回弹一起回落）

        function setup() {
            canvas = createCanvas(600, 600);
            canvas.elt.id = 'face';
            canvas.elt.style.zIndex = '1';
            centerCanvas();

            textFont('Arial');
            textSize(16);
            textAlign(CENTER, CENTER);

            selector = createSelect();
            for (let e in emotions) selector.option(e);
            selector.selected(current);
            selector.changed(() => {
                current = selector.value();
                buildFace();
            });

            selector.style('font-size', '16px');
            selector.style('padding', '4px 8px');
            selector.elt.style.zIndex = '2';
            positionDropdown();

            buildFace();
            buildGrid();
        }

        function centerCanvas() {
            // 画布水平居中，稍微下移给下拉框留出空间
            let x = (windowWidth - width) / 2;
            let y = (windowHeight - height) / 2 + 30;
            canvas.position(x, y);
        }

        function positionDropdown() {
            let x = (windowWidth - selector.width) / 2;
            let y = 20;
            selector.position(x, y);
        }

        function windowResized() {
            centerCanvas();
            positionDropdown();
        }

        // 根据当前情绪生成一张“脸”，并把所有单词的位置预先存起来
        function buildFace() {
            placements = [];
            grabbedWord = null;
            gridAnchor = null;
            let w = emotions[current];
            let cx = width / 2, cy = height / 2;

            addShape(cx, cy, 300, 380, 0, TWO_PI, w); // 头（外轮廓）

            if (current == 'joy') {
                addShape(cx - 70, cy - 50, 60, 30, 0, TWO_PI, w);
                addShape(cx + 70, cy - 50, 60, 30, 0, TWO_PI, w);
                addShape(cx, cy + 100, 140, 60, 0, PI, w);

            } else if (current == 'sadness') {
                addShape(cx - 70, cy - 50, 60, 30, PI, TWO_PI, w);
                addShape(cx + 70, cy - 50, 60, 30, PI, TWO_PI, w);
                addShape(cx, cy + 120, 120, 40, PI, TWO_PI, w);

            } else if (current == 'anger') {
                addShape(cx - 70, cy - 80, 60, 20, PI, TWO_PI, w);
                addShape(cx + 70, cy - 80, 60, 20, PI, TWO_PI, w);
                addShape(cx - 70, cy - 50, 50, 25, 0, TWO_PI, w);
                addShape(cx + 70, cy - 50, 50, 25, 0, TWO_PI, w);
                addShape(cx, cy + 110, 100, 20, 0, PI, w);

            } else if (current == 'fear') {
                addShape(cx - 70, cy - 50, 40, 60, 0, TWO_PI, w);
                addShape(cx + 70, cy - 50, 40, 60, 0, TWO_PI, w);
                addShape(cx, cy + 100, 40, 20, 0, TWO_PI, w);

            } else if (current == 'disgust') {
                addShape(cx - 70, cy - 60, 50, 30, PI, TWO_PI, w);
                addShape(cx + 70, cy - 60, 50, 30, PI, TWO_PI, w);
                addShape(cx, cy + 100, 100, 20, PI, TWO_PI, w);

            } else if (current == 'surprise') {
                addShape(cx - 70, cy - 60, 60, 60, 0, TWO_PI, w);
                addShape(cx + 70, cy - 60, 60, 60, 0, TWO_PI, w);
                addShape(cx, cy + 100, 50, 50, 0, TWO_PI, w);

            } else if (current == 'contempt') {
                addShape(cx - 70, cy - 80, 60, 20, PI, TWO_PI, w);
                addShape(cx + 70, cy - 50, 50, 25, 0, TWO_PI, w);
                addShape(cx, cy + 100, 100, 40, 0, PI / 2, w);
            }
        }

        // 把一段椭圆弧展开成一个个单词，记录位置/角度，供后面绘制和命中检测使用
        function addShape(cx, cy, w, h, a0, a1, words, max = 100) {
            let a = a0, i = 0;
            while (a < a1 && i < max) {
                let word = random(words);
                let tw = textWidth(word);               // 实际宽度，用于鼠标命中检测
                let step = (TWO_PI * (tw + 6) * 0.75) / (PI * (w + h) / 2);
                let x = cx + (w / 2) * cos(a);
                let y = cy + (h / 2) * sin(a);
                placements.push({
                    word: word,
                    chars: word.split(''),
                    x: x, y: y,
                    hx: x, hy: y,          // 原位（弹簧回弹的目标）
                    vx: 0, vy: 0,          // 速度
                    angle: a + HALF_PI,   // 沿椭圆切线方向
                    tw: tw,
                    hover: false,
                    reveal: 1             // 1 = 完整显示；0 = 完全乱码
                });
                a += step; i++;
            }
        }

        // 建立网格交点（每个交点是一根弹簧振子，会被字母带动）
        function buildGrid() {
            gridXs = []; gridYs = [];
            for (let x = 0; x <= width; x += gridSize) gridXs.push(x);
            if (gridXs[gridXs.length - 1] < width) gridXs.push(width);
            for (let y = 0; y <= height; y += gridSize) gridYs.push(y);
            if (gridYs[gridYs.length - 1] < height) gridYs.push(height);

            gridVerts = [];
            for (let r = 0; r < gridYs.length; r++) {
                gridVerts[r] = [];
                for (let c = 0; c < gridXs.length; c++) {
                    let hx = gridXs[c], hy = gridYs[r];
                    gridVerts[r][c] = { hx, hy, x: hx, y: hy, vx: 0, vy: 0 };
                }
            }
        }

        // 网格的弹簧物理：被抓住的字母会把附近的网格交点一起拉动，松开后一起回弹
        function updateGrid() {
            for (let r = 0; r < gridVerts.length; r++) {
                for (let c = 0; c < gridVerts[r].length; c++) {
                    let v = gridVerts[r][c];

                    // 默认目标 = 原位
                    let tx = v.hx, ty = v.hy;

                    // 锚点字母的位移按距离衰减，叠加到目标上，让网格“跟字母一起动”
                    if (gridAnchor) {
                        let ox = gridAnchor.x - gridAnchor.hx;
                        let oy = gridAnchor.y - gridAnchor.hy;
                        let dx = v.hx - gridAnchor.hx;
                        let dy = v.hy - gridAnchor.hy;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let radius = 120;                      // 影响半径（像素）
                        let infl = Math.max(0, 1 - dist / radius);
                        infl = infl * infl;                    // 近处更集中
                        tx += ox * infl;
                        ty += oy * infl;
                    }

                    let fx = (tx - v.x) * stiffness;
                    let fy = (ty - v.y) * stiffness;
                    v.vx = (v.vx + fx) * damping;
                    v.vy = (v.vy + fy) * damping;
                    v.x += v.vx;
                    v.y += v.vy;
                }
            }
        }

        // 作文网格背景（半透明白底 + 弹性形变的网格线）
        function drawGrid() {
            noStroke();
            fill(gridBgColor);
            rect(0, 0, width, height);

            stroke(gridColor);
            strokeWeight(1);
            // 竖线：按列，从上到下连
            for (let c = 0; c < gridVerts[0].length; c++) {
                for (let r = 0; r < gridVerts.length - 1; r++) {
                    line(gridVerts[r][c].x, gridVerts[r][c].y,
                         gridVerts[r + 1][c].x, gridVerts[r + 1][c].y);
                }
            }
            // 横线：按行，从左到右连
            for (let r = 0; r < gridVerts.length; r++) {
                for (let c = 0; c < gridVerts[r].length - 1; c++) {
                    line(gridVerts[r][c].x, gridVerts[r][c].y,
                         gridVerts[r][c + 1].x, gridVerts[r][c + 1].y);
                }
            }
        }

        function draw() {
            clear();

            // 更新每个单词：悬停乱码 + 弹簧物理
            for (let p of placements) {
                // 悬停乱码
                let over = pointInWord(mouseX, mouseY, p);
                if (over && !p.hover) p.reveal = 0;                 // 刚碰到：从头开始乱码
                p.hover = over;
                if (p.reveal < 1) p.reveal = min(1, p.reveal + 0.03); // 慢慢恢复成原词

                // 弹簧物理：被抓住时跟随鼠标，否则被弹簧拉回原位
                if (p === grabbedWord) {
                    p.x = mouseX;
                    p.y = mouseY;
                    p.vx = 0;
                    p.vy = 0;
                } else {
                    let fx = (p.hx - p.x) * stiffness;
                    let fy = (p.hy - p.y) * stiffness;
                    p.vx = (p.vx + fx) * damping;
                    p.vy = (p.vy + fy) * damping;
                    p.x += p.vx;
                    p.y += p.vy;
                }
            }

            // 网格：先更新弹簧物理（跟随字母），再画形变后的网格
            updateGrid();
            drawGrid();

            for (let p of placements) drawPlacement(p);
        }

        function drawPlacement(p) {
            push();
            translate(p.x, p.y);
            rotate(p.angle);
            fill(0);
            if (p.reveal >= 1) {
                text(p.word, 0, 0);
            } else {
                text(scrambleWord(p), 0, 0);
            }
            pop();
        }

        // 生成“部分已恢复、部分还在乱码”的字符串：从左到右逐个字符恢复
        function scrambleWord(p) {
            let n = p.chars.length;
            let revealed = floor(p.reveal * n);   // 已恢复的字符个数
            let s = '';
            for (let i = 0; i < n; i++) {
                s += (i < revealed) ? p.chars[i] : randomScrambleChar();
            }
            return s;
        }

        function randomScrambleChar() {
            return SCRAMBLE_CHARS.charAt(floor(random(SCRAMBLE_CHARS.length)));
        }

        // 把鼠标坐标变换到单词的局部坐标系，判断是否落在文字矩形内（支持旋转后的文字）
        function pointInWord(mx, my, p, padX = 4, padY = 12) {
            let dx = mx - p.x, dy = my - p.y;
            let c = cos(-p.angle), s = sin(-p.angle);
            let lx = dx * c - dy * s;
            let ly = dx * s + dy * c;
            return abs(lx) <= p.tw / 2 + padX && abs(ly) <= padY;
        }

        // 找鼠标下方的单词（命中范围略放宽，方便点击）
        function wordAt(mx, my) {
            for (let p of placements) {
                if (pointInWord(mx, my, p, 8, 16)) return p;
            }
            return null;
        }

        // 按下：抓住鼠标下方最近的单词；松开：放手，让它弹回原位
        function mousePressed() {
            grabbedWord = wordAt(mouseX, mouseY);
            if (grabbedWord) gridAnchor = grabbedWord;   // 网格跟随这个被抓住的字母
        }

        function mouseReleased() {
            grabbedWord = null;
        }
    </script>

    <script>
    // ===== ASCII 波形背景（移植自 Ariadne asciiPaintCode / Hk）=====
    (function () {
        const SETTINGS = {
            characters: 'cyslap',
            opacity: 0.77,
            fontSize: 6.8,
            density: 1.1,
            speed: 1.5,          // 时钟倍率
            direction: 65,       // 流场旋转角度（度）
            twist: 2,            // 扭曲
            tension: 0.4,        // 波形紧密度
            color: '#212121',
            pointerStrength: 1,  // 指针扰动强度
            pointerRadius: 100   // 影响半径（px）
        };
        const DURATION_MS = 4000;                 // asciiPhase 0 → 2π 用时 4s
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const canvas = document.getElementById('wave-bg');
        const ctx = canvas.getContext('2d');
        const pointer = { x: -1e3, y: -1e3, vx: 0, vy: 0, energy: 0, inside: false };
        let phase = 0;   // 累计相位（单调递增，回绕连续）

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 指针：移动积累能量，静止衰减，离开清零
        window.addEventListener('pointermove', (e) => {
            const nx = e.clientX, ny = e.clientY;
            if (pointer.x > -1e2) {
                pointer.vx = nx - pointer.x;
                pointer.vy = ny - pointer.y;
                pointer.energy = Math.min(1, pointer.energy + Math.hypot(pointer.vx, pointer.vy) * 0.04);
            }
            pointer.x = nx; pointer.y = ny; pointer.inside = true;
        });
        window.addEventListener('pointerleave', () => { pointer.inside = false; pointer.energy = 0; });

        // 逐行移植自 Hk：多流场 + 扭曲 + 指针局部扰动
        function paintAscii() {
            const W = canvas.width, H = canvas.height;
            const chars = Array.from(SETTINGS.characters);
            const time = phase * (2 / Math.PI) * SETTINGS.speed;   // s = t*4/(2π)*speed
            const cellW = Math.max(2.6, SETTINGS.fontSize * 1.2 / SETTINGS.density);
            const cellH = Math.max(3.2, SETTINGS.fontSize * 1.4 / SETTINGS.density);
            const u = 0.72 + SETTINGS.tension * 0.56;
            const d = 49 / (0.86 + SETTINGS.tension * 0.34);
            const rot = SETTINGS.direction * Math.PI / 180;

            ctx.clearRect(0, 0, W, H);
            ctx.font = SETTINGS.fontSize + 'px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
            ctx.textBaseline = 'top';
            ctx.fillStyle = SETTINGS.color;

            for (let rowY = -cellH * 2; rowY < H + cellH * 2; rowY += cellH) {
                for (let colX = -cellW * 2; colX < W + cellW * 2; colX += cellW) {
                    let mx = colX, my = rowY;          // 流场采样坐标
                    let drawX = colX, drawY = rowY;    // 绘制坐标

                    if (pointer.energy > 0 && SETTINGS.pointerStrength > 0) {
                        const dx = colX - pointer.x, dy = rowY - pointer.y;
                        const gauss = Math.exp(-(dx * dx + dy * dy) / (SETTINGS.pointerRadius ** 2 * 1.9))
                                    * pointer.energy * SETTINGS.pointerStrength;
                        const wobble = gauss * (Math.sin(dx * 0.047 + dy * 0.023 - time * 2.55) * 52
                                      + Math.cos(dy * 0.041 - dx * 0.019 + time * 2.18) * 24);
                        const gauss184 = gauss * 184;
                        const dispX = -pointer.vx * gauss184 - pointer.vy * wobble;
                        const dispY = -pointer.vy * gauss184 + pointer.vx * wobble;
                        mx += dispX; my += dispY;
                        drawX += Math.tanh(dispX / 28) * cellW * 1.6;
                        drawY += Math.tanh(dispY / 28) * cellH * 1.45;
                    }

                    const twistAngle = rot + SETTINGS.twist * (
                        Math.sin((mx + my) * 0.0032 + time * 0.11) * 0.72
                        + Math.cos(my * 0.0044 - mx * 0.0017 - time * 0.08) * 0.38
                    );
                    const y = (mx - W / 2) * Math.cos(twistAngle) - (my - H / 2) * Math.sin(twistAngle) + W / 2;
                    const b = (mx - W / 2) * Math.sin(twistAngle) + (my - H / 2) * Math.cos(twistAngle) + H / 2;

                    const x = Math.sin(b * 0.009 * u - time * 0.42) * d + Math.cos(b * 0.004 * u + time * 0.25) * d * 0.44;
                    const S = Math.sin((y + x) * 0.036 * u + time * 0.35);
                    const C = Math.sin((y * 0.61 - b * 0.48 + Math.sin(b * 0.014 * u - time * 0.18) * 26) * 0.044 * u - time * 0.27);
                    const w = Math.sin((y * 0.34 + b * 0.72 + Math.cos(y * 0.009 * u + time * 0.12) * 24) * 0.052 * u + time * 0.21);
                    const T = Math.sin(y * 0.11 * u + b * 0.067 * u + time * 0.48) * 0.09
                            + Math.cos(b * 0.093 * u - y * 0.041 * u - time * 0.36) * 0.06;
                    const E = S * 0.28 + C * 0.24 + w * 0.22 + Math.sin((y - b * 0.21) * 0.018 * u + time * 0.3) * 0.26;
                    const D = Math.max(0.03, Math.min(0.98, 0.52 + E * 0.35 + T));

                    const a0 = Math.max(0.04, Math.min(0.95, 0.2 + D * 0.43 + (D - 0.5) * 0.1));
                    ctx.globalAlpha = SETTINGS.opacity * (Math.round(a0 * 20) / 20);
                    ctx.fillText(chars[Math.min(chars.length - 1, Math.floor(D * chars.length))], drawX, drawY);
                }
            }
            ctx.globalAlpha = 1;
        }

        let last = performance.now();
        function loop(now) {
            const dt = Math.min(50, now - last);
            last = now;

            if (reducedMotion) {
                phase = 0; pointer.energy = 0;      // 减少动态：静态目标帧
            } else {
                if (pointer.inside) pointer.energy *= 0.94; else pointer.energy = 0;
                phase += (Math.PI * 2) * (dt / DURATION_MS);
            }

            paintAscii();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
